services:
  finanzas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finanzas-inteligentes
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?Configurá DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENABLE_HTTPS=${ENABLE_HTTPS:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
