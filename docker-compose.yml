services:
  finanzas-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finanzas-inteligentes
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:?Configurá DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENABLE_HTTPS=${ENABLE_HTTPS:-false}
